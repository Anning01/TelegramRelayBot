{% extends "base.html" %}
{% block content %}
<div class="flex items-center mb-6">
    <a href="/stats" class="text-blue-600 hover:underline mr-4">← 返回</a>
    <h1 class="text-2xl font-bold">标记 <span class="text-blue-600">[{{ tag }}]</span> 的统计数据</h1>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Chart 1: Timeline -->
    <div class="bg-white p-6 rounded shadow">
        <h3 class="font-bold text-gray-700 mb-4">消息量趋势（时间线）</h3>
        <canvas id="timelineChart"></canvas>
    </div>

    <!-- Chart 2: Hourly Distribution -->
    <div class="bg-white p-6 rounded shadow">
        <h3 class="font-bold text-gray-700 mb-4">消息时段分布</h3>
        <canvas id="hourlyChart"></canvas>
    </div>
</div>

<div class="mt-8 bg-white p-6 rounded shadow">
    <h3 class="font-bold text-gray-700 mb-4">最近消息</h3>
    <ul class="divide-y">
        {% for log in logs[-10:]|reverse %}
        <li class="py-2">
            <span class="text-gray-500 text-sm">{{ log.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</span>
            <span class="ml-4 font-mono bg-gray-100 px-2 py-1 rounded">#{{ log.assigned_index }}</span>
            <span class="ml-2 text-gray-600">原发送者: {{ log.original_sender_name }}</span>
        </li>
        {% endfor %}
    </ul>
</div>

<script>
    const logs = [
        {% for log in logs %}
        {
            timestamp: new Date("{{ log.timestamp.isoformat() }}"),
            index: {{ log.assigned_index }}
        },
        {% endfor %}
    ];

    // Process data for Timeline (Group by Date)
    const dateCounts = {};
    logs.forEach(log => {
        const dateStr = log.timestamp.toISOString().split('T')[0];
        dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
    });
    
    const sortedDates = Object.keys(dateCounts).sort();
    const timelineData = sortedDates.map(d => dateCounts[d]);

    new Chart(document.getElementById('timelineChart'), {
        type: 'line',
        data: {
            labels: sortedDates,
            datasets: [{
                label: '消息数量',
                data: timelineData,
                borderColor: 'rgb(59, 130, 246)',
                tension: 0.1
            }]
        },
        options: { scales: { y: { beginAtZero: true } } }
    });

    // Process data for Hourly Distribution
    const hourCounts = new Array(24).fill(0);
    logs.forEach(log => {
        const hour = log.timestamp.getHours();
        hourCounts[hour]++;
    });

    new Chart(document.getElementById('hourlyChart'), {
        type: 'bar',
        data: {
            labels: Array.from({length: 24}, (_, i) => i + ":00"),
            datasets: [{
                label: '消息数量（按小时）',
                data: hourCounts,
                backgroundColor: 'rgb(16, 185, 129)',
            }]
        },
        options: { scales: { y: { beginAtZero: true } } }
    });
</script>
{% endblock %}
