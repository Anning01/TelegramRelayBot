{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">数据统计总览</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    {% for tag, count in stats %}
    <a href="/stats/{{ tag }}" class="block bg-white p-6 rounded shadow hover:shadow-lg transition">
        <div class="text-gray-500 text-sm">用户标记</div>
        <div class="text-3xl font-bold text-blue-600">{{ tag if tag else '(未设置)' }}</div>
        <div class="mt-2 text-gray-700">已转发 {{ count }} 条消息</div>
    </a>
    {% endfor %}
</div>

{% if not stats %}
<p class="text-gray-500">暂无统计数据。</p>
{% endif %}
{% endblock %}
